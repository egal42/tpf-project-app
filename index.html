<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Pioneer Forest Project</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        radial-gradient(circle at top, #0f5a32 0%, #03170d 70%);
      color: #f2efe6;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .card {
      max-width: 520px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 3rem 2rem;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 30px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 1rem;
    }

    p {
      line-height: 1.7;
      opacity: 0.92;
      margin-bottom: 2rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    button,
    a {
      text-decoration: none;
      padding: 1rem;
      border-radius: 14px;
      font-weight: bold;
      transition: 0.2s ease;
      font-family: Georgia, serif;
      font-size: 1rem;
      cursor: pointer;
    }

    button {
      border: none;
    }

    .primary {
      background: #d4af37;
      color: #111;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: #f2efe6;
      border: 1px solid rgba(255,255,255,0.08);
    }

    button:hover,
    a:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    #status {
      font-size: 0.9rem;
      opacity: 0.82;
      margin-top: 1.2rem;
      margin-bottom: 0;
      word-break: break-word;
    }
  </style>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <script>
    try {
      if (window.Pi) {
        window.Pi.init({
          version: "2.0",
          sandbox: true
        });
      }
    } catch (error) {
      console.error("Pi init error:", error);
    }
  </script>
</head>

<body>

  <div class="card">
    <h1>The Pioneer Forest Project</h1>

    <p>
      A Pi-powered reforestation project focused on
      transparency, real-world impact, and growing forest journeys.
    </p>

    <p style="font-size:0.92rem; opacity:0.72; margin-top:-1rem;">
      Testnet preview. Best experienced inside Pi Browser.
    </p>

    <div class="buttons">

      <button class="primary" id="loginBtn">
        Enter with Pi Login
      </button>

      <button class="primary" id="paymentBtn" disabled>
        Test 0.01 Pi Support Flow
      </button>

      <a href="https://fireside.pinet.com/channels/ThePioneerForest" class="secondary">
        TPF Fireside Updates
      </a>

    </div>

    <p id="status">
      Ready for Pi login.
    </p>

    <p style="font-size:0.8rem; opacity:0.55; margin-top:2rem; margin-bottom:0;">
      Development preview — Testnet phase
    </p>

  </div>

  <script>
    const loginBtn = document.getElementById("loginBtn");
    const paymentBtn = document.getElementById("paymentBtn");
    const statusEl = document.getElementById("status");

    let currentUser = null;

    function getPaymentId(paymentData) {
      if (typeof paymentData === "string") {
        return paymentData;
      }

      if (paymentData && paymentData.identifier) {
        return paymentData.identifier;
      }

      return paymentData;
    }

    loginBtn.addEventListener("click", async function() {
      statusEl.textContent = "Starting Pi login...";

      try {
        if (!window.Pi) {
          statusEl.textContent = "Pi SDK not available. Please open this app inside Pi Browser.";
          return;
        }

        const auth = await window.Pi.authenticate(
          ["username", "payments"],
          function onIncompletePaymentFound(payment) {
            console.log("Incomplete payment found:", payment);
            statusEl.textContent = "Incomplete payment found. Check console/logs.";
          }
        );

        currentUser = auth.user;

        console.log("Authentication successful:", auth);

        statusEl.textContent = "Welcome, @" + auth.user.username + " 🌱";

        loginBtn.textContent = "Logged in as @" + auth.user.username;
        loginBtn.disabled = true;
        loginBtn.style.opacity = "0.85";

        paymentBtn.disabled = false;

      } catch (error) {
        console.error("Pi login error:", error);
        statusEl.textContent = "Pi login failed or was cancelled.";
      }
    });

    paymentBtn.addEventListener("click", async function() {
      if (!window.Pi) {
        statusEl.textContent = "Pi SDK not available.";
        return;
      }

      if (!currentUser) {
        statusEl.textContent = "Please login with Pi first.";
        return;
      }

      statusEl.textContent = "Creating Testnet payment...";

      const paymentData = {
        amount: 0.01,
        memo: "TPF Testnet support flow",
        metadata: {
          app: "The Pioneer Forest Project",
          type: "testnet_support_flow",
          username: currentUser.username
        }
      };

      const paymentCallbacks = {
        onReadyForServerApproval: async function(paymentDTO) {
          const paymentId = getPaymentId(paymentDTO);

          statusEl.textContent = "Approving payment on server...";

          const response = await fetch("/.netlify/functions/approve-payment", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              paymentId: paymentId
            })
          });

          const data = await response.json();

          console.log("Approval response:", data);
        },

        onReadyForServerCompletion: async function(paymentDTO, txid) {
          const paymentId = getPaymentId(paymentDTO);

          statusEl.textContent = "Completing payment on server...";

          const response = await fetch("/.netlify/functions/complete-payment", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              paymentId: paymentId,
              txid: txid
            })
          });

          const data = await response.json();

          console.log("Completion response:", data);

          statusEl.textContent = "Testnet payment completed. Thank you, @" + currentUser.username + " 🌱";
        },

        onCancel: function(paymentDTO) {
          console.log("Payment cancelled:", paymentDTO);
          statusEl.textContent = "Payment cancelled.";
        },

        onError: function(error, paymentDTO) {
          console.error("Payment error:", error, paymentDTO);
          statusEl.textContent = "Payment error. Check logs.";
        }
      };

      try {
        window.Pi.createPayment(paymentData, paymentCallbacks);
      } catch (error) {
        console.error("Create payment error:", error);
        statusEl.textContent = "Could not create payment.";
      }
    });
  </script>

</body>
</html>
